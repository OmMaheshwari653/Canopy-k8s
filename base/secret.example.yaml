# ============================================================
#  SECRET - this is a TEMPLATE, not the real values
# ============================================================
# *** The biggest misconception about Secrets ***
# Kubernetes Secret values are base64. base64 is NOT ENCRYPTION - it is just
# encoding, and anyone can read it back with `base64 -d`.
# So a Secret file holding real values must NEVER be committed to Git.
#
# This file is committed with placeholders (so the required keys are
# documented), and scripts/create-secrets.sh builds the real Secrets.
#
# Once Argo CD syncs from Git this becomes a genuine problem, and the proper
# fix is Sealed Secrets or the External Secrets Operator.
---
apiVersion: v1
kind: Secret
metadata:
  name: canopy-mongo
type: Opaque
stringData: # stringData = write plaintext, Kubernetes base64-encodes it
  MONGO_ROOT_USERNAME: "REPLACE_ME"
  MONGO_ROOT_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: canopy-server-secrets
type: Opaque
stringData:
  MONGO_URI: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  ADMIN_SECRET_KEY: "REPLACE_ME"
  CLOUDINARY_CLOUD_NAME: "REPLACE_ME"
  CLOUDINARY_API_KEY: "REPLACE_ME"
  CLOUDINARY_API_SECRET: "REPLACE_ME"
