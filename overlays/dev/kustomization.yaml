apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: canopy

resources:
  - ../../base
  # Encrypted Secrets, safe to commit. The sealed-secrets controller in this
  # cluster holds the only private key that can decrypt them, and it creates
  # the real Secret objects from these.
  #
  # They live here rather than in base/ because a SealedSecret is sealed
  # against a specific name AND namespace - these only decrypt in `canopy`.
  # Every environment needs its own, generated by scripts/seal-secrets.sh.
  - sealedsecret-canopy-mongo.yaml
  - sealedsecret-canopy-server-secrets.yaml

# Local images, side-loaded with `minikube image load`.
images:
  - name: canopy-server
    newTag: dev
  - name: canopy-client
    newTag: dev

patches:
  - path: patch-dev.yaml
  # No HPA in dev - on a laptop it only burns resources and stops you from
  # setting replicas by hand.
  - target:
      kind: HorizontalPodAutoscaler
      name: canopy-client
    patch: |
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: canopy-client
